; Generado por xampp-linux. Se sobrescribe al guardar los Ajustes.
[PHP]
extension=mysqli
extension=pdo_mysql
extension=intl
extension=gd
extension=iconv
display_errors = On
error_reporting = E_ALL
log_errors = On
error_log = $logs/php-error.log
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
date.timezone = UTC

[Session]
session.save_path = "$run"

[mail function]
sendmail_path = "/usr/bin/mailpit sendmail -S 127.0.0.1:$smtp_port"

[MySQLi]
mysqli.default_socket = $run/mariadb.sock
mysqli.default_port = $mariadb_port

[Pdo_mysql]
pdo_mysql.default_socket = $run/mariadb.sock
