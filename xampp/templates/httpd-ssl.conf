
LoadModule socache_shmcb_module /usr/lib/httpd/modules/mod_socache_shmcb.so
LoadModule ssl_module /usr/lib/httpd/modules/mod_ssl.so
Listen 127.0.0.1:$https_port
Listen [::1]:$https_port
SSLSessionCache "shmcb:$run/ssl_scache(512000)"
<VirtualHost *:$https_port>
    ServerName localhost
    DocumentRoot "$htdocs"
    SSLEngine on
    SSLCertificateFile $ssl/localhost.pem
    SSLCertificateKeyFile $ssl/localhost-key.pem
</VirtualHost>
